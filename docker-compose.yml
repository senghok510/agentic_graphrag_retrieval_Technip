
services:
  backend:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    env_file:
      - .env
    ports:
      - "7060:7060"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7060/pipeline/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  frontend:
    build:
      context: ./web/pipeline-ui
      dockerfile: Dockerfile
    environment:
      PIPELINE_API_URL: http://backend:7060
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
